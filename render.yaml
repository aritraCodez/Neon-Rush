# Adds only the multiplayer server. Keep the existing Render Static Site.
services:
  - type: web
    name: neon-rush-arena
    runtime: node
    plan: free
    rootDir: neon-rush
    buildCommand: npm ci --prefix server --omit=dev
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://neon-rush-rsii.onrender.com
